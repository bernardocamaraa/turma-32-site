<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" href="/icone-180.png" />
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <!-- Lets the site sit on a phone's home screen as an app: on an iPhone
         that's the only way a site can show notifications (the committee's
         vote alert, src/lib/avisos.ts). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The block between the "previa" comments is what WhatsApp & co. read
         to build a link preview. middleware.ts swaps it, for a personal
         /mesas/<link> URL, for one with that formando's name and image;
         the images come from scripts/gerar-previas.mjs. og:image must be an
         absolute URL — update the domain here if the site moves. -->
    <!-- previa -->
    <title>Turma 32 · Formatura 2026</title>
    <meta name="description" content="Baile de formatura da Turma 32: 10 de dezembro de 2026, no Ballroom Casa de Festas, em Nova Iguaçu. Horário, traje e como chegar." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turma 32" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Turma 32 · Baile de formatura" />
    <meta property="og:description" content="10 de dezembro de 2026, no Ballroom Casa de Festas, em Nova Iguaçu. Horário, traje e como chegar." />
    <meta property="og:image" content="https://turma-32-site.vercel.app/previas/turma-32.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo da Turma 32 sobre as assinaturas dos formandos" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /previa -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
